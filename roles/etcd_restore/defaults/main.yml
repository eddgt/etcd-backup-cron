---
# roles/etcd_restore/defaults/main.yml
# Valores por defecto del rol de restauración de etcd para RKE2.

# --- Binarios y rutas de RKE2 ---
rke2_bin: "/usr/local/bin/rke2"
rke2_kubectl: "/var/lib/rancher/rke2/bin/kubectl"
rke2_kubeconfig: "/etc/rancher/rke2/rke2.yaml"
rke2_snapshot_dir: "/var/lib/rancher/rke2/server/db/snapshots"
rke2_etcd_dir: "/var/lib/rancher/rke2/server/db/etcd"

# Directorio de storage central (servidores de backup). Normalmente en group_vars/all.yml.
etcd_backup_server_dir: "/srv/backup/kubernetes/etcd"

# Nodo donde se ejecuta el 'cluster-reset'. El resto de control planes se reincorpora.
# Por defecto, el primer host del grupo control_planes.
etcd_restore_primary: "{{ groups['control_planes'][0] }}"

# --- Origen del snapshot a restaurar ---
# - 'backup_server': descarga el snapshot desde el servidor de storage central.
# - 'controller': usa un snapshot ubicado localmente en el host controlador de Ansible.
etcd_restore_source: "backup_server"

# Directorio local en el controlador (cuando etcd_restore_source == 'controller')
etcd_restore_local_path: "{{ playbook_dir }}/backups"

# Nombre o ruta del snapshot a restaurar.
# Vacío ("") => se selecciona automáticamente el más reciente del origen elegido.
etcd_restore_file_path: ""
