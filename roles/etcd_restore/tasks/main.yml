---
# roles/etcd_restore/tasks/main.yml
# Restauración ante desastres de etcd para RKE2 (clúster HA).
#
# Procedimiento oficial de RKE2:
#   1. Detener rke2-server en TODOS los control planes.
#   2. En el nodo primario: rke2 server --cluster-reset --cluster-reset-restore-path=<snapshot>.
#   3. Iniciar rke2-server en el primario y esperar a que la API responda.
#   4. En el resto de control planes: borrar el directorio db/etcd y reiniciar para reincorporarse.
#   5. Validar la salud del clúster.
#
# Ansible ejecuta cada tarea como barrera (espera a todos los hosts antes de la siguiente),
# por lo que las tareas 'run_once' sobre el primario garantizan el orden primario -> secundarios.

# ==============================================================================
# FASE 1: Selección del snapshot a restaurar
# ==============================================================================
- name: RESTAURACIÓN - Mostrar el nodo primario seleccionado para el cluster-reset
  ansible.builtin.debug:
    msg: "Nodo primario: {{ etcd_restore_primary }}. El resto de control planes se reincorporará tras el reset."
  run_once: true

# --- Origen A: Servidor de Backup remoto ---
- name: STORAGE - Buscar snapshots en el servidor de storage
  ansible.builtin.find:
    paths: "{{ etcd_backup_server_dir }}"
    patterns: "*etcd-snapshot-*"
    file_type: file
  register: remote_snapshots
  delegate_to: "{{ groups['backup_servers'][0] }}"
  run_once: true
  when: etcd_restore_source == 'backup_server' and etcd_restore_file_path == ""

- name: STORAGE - Validar que existan snapshots en el storage
  ansible.builtin.fail:
    msg: "No se encontraron snapshots en {{ etcd_backup_server_dir }} del servidor de storage."
  run_once: true
  when:
    - etcd_restore_source == 'backup_server'
    - etcd_restore_file_path == ""
    - remote_snapshots.files is not defined or remote_snapshots.files | length == 0

- name: STORAGE - Seleccionar el snapshot más reciente del storage
  ansible.builtin.set_fact:
    selected_backup_filename: "{{ (remote_snapshots.files | sort(attribute='mtime', reverse=true) | first).path | basename }}"
  run_once: true
  when: etcd_restore_source == 'backup_server' and etcd_restore_file_path == ""

- name: STORAGE - Usar el snapshot específico indicado por el usuario
  ansible.builtin.set_fact:
    selected_backup_filename: "{{ etcd_restore_file_path | basename }}"
  run_once: true
  when: etcd_restore_source == 'backup_server' and etcd_restore_file_path != ""

- name: STORAGE - Descargar el snapshot seleccionado al controlador
  ansible.builtin.fetch:
    src: "{{ etcd_backup_server_dir }}/{{ selected_backup_filename }}"
    dest: "/tmp/ansible-etcd-restore/{{ selected_backup_filename }}"
    flat: true
  delegate_to: "{{ groups['backup_servers'][0] }}"
  run_once: true
  when: etcd_restore_source == 'backup_server'

- name: STORAGE - Registrar la ruta local del snapshot en el controlador
  ansible.builtin.set_fact:
    controller_snapshot_path: "/tmp/ansible-etcd-restore/{{ selected_backup_filename }}"
  run_once: true
  when: etcd_restore_source == 'backup_server'

# --- Origen B: Controlador local (host Ansible) ---
- name: CONTROLADOR - Buscar snapshots en el directorio local
  ansible.builtin.find:
    paths: "{{ etcd_restore_local_path }}"
    patterns: "*etcd-snapshot-*"
    file_type: file
  register: local_snapshots
  delegate_to: localhost
  become: false
  run_once: true
  when: etcd_restore_source == 'controller' and etcd_restore_file_path == ""

- name: CONTROLADOR - Validar que existan snapshots locales
  ansible.builtin.fail:
    msg: "No se encontraron snapshots en el directorio local {{ etcd_restore_local_path }}."
  run_once: true
  when:
    - etcd_restore_source == 'controller'
    - etcd_restore_file_path == ""
    - local_snapshots.files is not defined or local_snapshots.files | length == 0

- name: CONTROLADOR - Seleccionar el snapshot local más reciente
  ansible.builtin.set_fact:
    controller_snapshot_path: "{{ (local_snapshots.files | sort(attribute='mtime', reverse=true) | first).path }}"
  run_once: true
  when: etcd_restore_source == 'controller' and etcd_restore_file_path == ""

- name: CONTROLADOR - Resolver la ruta del archivo local específico
  ansible.builtin.set_fact:
    controller_snapshot_path: "{{ etcd_restore_file_path if etcd_restore_file_path.startswith('/') else (etcd_restore_local_path ~ '/' ~ etcd_restore_file_path) }}"
  run_once: true
  when: etcd_restore_source == 'controller' and etcd_restore_file_path != ""

- name: CONTROLADOR - Validar existencia del archivo local específico
  ansible.builtin.stat:
    path: "{{ controller_snapshot_path }}"
  register: local_specific_file_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: etcd_restore_source == 'controller' and etcd_restore_file_path != ""

- name: CONTROLADOR - Falla si el archivo local específico no existe
  ansible.builtin.fail:
    msg: "El archivo de backup local especificado no existe: {{ controller_snapshot_path }}"
  run_once: true
  when:
    - etcd_restore_source == 'controller'
    - etcd_restore_file_path != ""
    - not local_specific_file_stat.stat.exists

# ==============================================================================
# FASE 2: Colocar el snapshot en el nodo primario
# ==============================================================================
- name: RESTAURACIÓN - Definir la ruta de destino del snapshot en el nodo primario
  ansible.builtin.set_fact:
    restore_snapshot_master_path: "{{ rke2_snapshot_dir }}/{{ controller_snapshot_path | basename }}"
  run_once: true

- name: RESTAURACIÓN - Asegurar que el directorio de snapshots existe en el nodo primario
  ansible.builtin.file:
    path: "{{ rke2_snapshot_dir }}"
    state: directory
    mode: '0700'
    owner: root
    group: root
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

- name: RESTAURACIÓN - Copiar el snapshot al nodo primario
  ansible.builtin.copy:
    src: "{{ controller_snapshot_path }}"
    dest: "{{ restore_snapshot_master_path }}"
    mode: '0600'
    owner: root
    group: root
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

# ==============================================================================
# FASE 3: Detener RKE2 en TODOS los control planes
# ==============================================================================
- name: RESTAURACIÓN - Detener rke2-server en todos los control planes
  ansible.builtin.systemd:
    name: rke2-server
    state: stopped

- name: RESTAURACIÓN - Verificar si existe el script rke2-killall.sh
  ansible.builtin.stat:
    path: /usr/local/bin/rke2-killall.sh
  register: rke2_killall

- name: RESTAURACIÓN - Ejecutar rke2-killall.sh para detener etcd y contenedores residuales
  ansible.builtin.command: /usr/local/bin/rke2-killall.sh
  changed_when: true
  when: rke2_killall.stat.exists

# ==============================================================================
# FASE 4: Reset + restauración del snapshot en el nodo primario
# ==============================================================================
- name: "RESTAURACIÓN [Primario] - Ejecutar cluster-reset restaurando el snapshot"
  ansible.builtin.command:
    cmd: "{{ rke2_bin }} server --cluster-reset --cluster-reset-restore-path={{ restore_snapshot_master_path }}"
  register: cluster_reset_output
  changed_when: true
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

- name: "RESTAURACIÓN [Primario] - Mostrar salida del cluster-reset"
  ansible.builtin.debug:
    var: cluster_reset_output.stdout_lines
  run_once: true

- name: "RESTAURACIÓN [Primario] - Iniciar rke2-server tras el reset"
  ansible.builtin.systemd:
    name: rke2-server
    state: started
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

- name: "RESTAURACIÓN [Primario] - Esperar a que la API de Kubernetes esté lista (/readyz)"
  ansible.builtin.command: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get --raw=/readyz"
  register: primary_readyz
  changed_when: false
  retries: 30
  delay: 10
  until: primary_readyz.rc == 0
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

# ==============================================================================
# FASE 5: Reincorporar el resto de control planes
# ==============================================================================
- name: "RESTAURACIÓN [Secundarios] - Eliminar el directorio etcd obsoleto"
  ansible.builtin.file:
    path: "{{ rke2_etcd_dir }}"
    state: absent
  when: inventory_hostname != etcd_restore_primary

- name: "RESTAURACIÓN [Secundarios] - Iniciar rke2-server para reincorporarse al clúster"
  ansible.builtin.systemd:
    name: rke2-server
    state: started
  when: inventory_hostname != etcd_restore_primary

# ==============================================================================
# FASE 6: Validación final y limpieza
# ==============================================================================
- name: RESTAURACIÓN - Esperar a que la API responda y mostrar el estado de los nodos
  ansible.builtin.command: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get nodes"
  register: kubectl_nodes_check
  changed_when: false
  retries: 30
  delay: 10
  until: kubectl_nodes_check.rc == 0
  delegate_to: "{{ etcd_restore_primary }}"
  run_once: true

- name: RESTAURACIÓN - Mostrar estado final de los nodos del clúster
  ansible.builtin.debug:
    var: kubectl_nodes_check.stdout_lines
  run_once: true

- name: LIMPIEZA - Eliminar archivos temporales de restauración del controlador
  ansible.builtin.file:
    path: "/tmp/ansible-etcd-restore"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: etcd_restore_source == 'backup_server'
