---
# roles/etcd_backup/defaults/main.yml
# Valores por defecto del rol etcd_backup (sobreescribibles en group_vars/host_vars)

# Directorio donde RKE2 deposita automáticamente sus snapshots de etcd en cada control plane
rke2_snapshot_dir: "/var/lib/rancher/rke2/server/db/snapshots"

# Directorio final de almacenamiento en los servidores de backup
etcd_backup_server_dir: "/srv/backup/kubernetes/etcd"

# Método de transferencia:
#  - 'controller_mediated' (por defecto): el controlador Ansible hace de puente.
#  - 'direct_rsync': los masters hacen rsync directo al storage (requiere conectividad y SSH).
etcd_transfer_mode: "controller_mediated"

# --- Política de Retención ---
# Cantidad de copias a retener por cada master en los servidores de backup.
# La retención en el origen (control planes) la gestiona el propio RKE2.
etcd_backup_server_retention_count: 3
