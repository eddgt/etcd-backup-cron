---
# roles/etcd_backup/tasks/transfer.yml
#
# Copia el snapshot de etcd más reciente que RKE2 generó automáticamente en cada
# control plane hacia los servidores de backup. El snapshot se transfiere "tal cual"
# (raw), sin comprimir, y el original gestionado por RKE2 NUNCA se modifica ni borra.

# ==============================================================================
# PREPARACIÓN: Asegurar directorios de destino en los servidores de backup
# ==============================================================================
- name: TRANSFERENCIA - Asegurar que existe el directorio de destino en los Servidores de Storage
  ansible.builtin.file:
    path: "{{ etcd_backup_server_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ item }}"
  loop: "{{ groups['backup_servers'] }}"
  run_once: true

# ==============================================================================
# DETECCIÓN: Localizar el último snapshot generado por RKE2 en cada control plane
# ==============================================================================
- name: TRANSFERENCIA - Buscar los snapshots automáticos de RKE2 en el control plane
  ansible.builtin.find:
    paths: "{{ rke2_snapshot_dir }}"
    patterns: "etcd-snapshot-*"
    file_type: file
  register: rke2_found_snapshots

- name: TRANSFERENCIA - Validar que existan snapshots de RKE2 en el control plane
  ansible.builtin.fail:
    msg: "No se encontraron snapshots de etcd en la ruta oficial de RKE2 ({{ rke2_snapshot_dir }}) en {{ inventory_hostname }}."
  when: rke2_found_snapshots.files is not defined or rke2_found_snapshots.files | length == 0

- name: TRANSFERENCIA - Establecer la ruta del snapshot RKE2 más reciente
  ansible.builtin.set_fact:
    etcd_snapshot_src: "{{ (rke2_found_snapshots.files | sort(attribute='mtime', reverse=true) | first).path }}"

- name: TRANSFERENCIA - Informar el snapshot seleccionado en cada control plane
  ansible.builtin.debug:
    msg: "Snapshot seleccionado en {{ inventory_hostname }}: {{ etcd_snapshot_src | basename }}"

# ==============================================================================
# MODO 1: Mediante la Máquina Controladora (Controller-Mediated Transfer)
# Los control planes y los servidores de storage no requieren conectividad directa.
# ==============================================================================
- name: TRANSFERENCIA [Modo Controlador] - Descargar snapshot al host Ansible controlador
  ansible.builtin.fetch:
    src: "{{ etcd_snapshot_src }}"
    dest: "/tmp/ansible-etcd-backups/{{ inventory_hostname }}/"
    flat: true
  when: etcd_transfer_mode == 'controller_mediated'

- name: TRANSFERENCIA [Modo Controlador] - Subir snapshot a los servidores de backup
  ansible.builtin.copy:
    src: "/tmp/ansible-etcd-backups/{{ inventory_hostname }}/{{ etcd_snapshot_src | basename }}"
    dest: "{{ etcd_backup_server_dir }}/{{ inventory_hostname }}-{{ etcd_snapshot_src | basename }}"
    mode: '0600'
    owner: "{{ ansible_user }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['backup_servers'] }}"
  when: etcd_transfer_mode == 'controller_mediated'

- name: TRANSFERENCIA [Modo Controlador] - Limpiar archivos temporales del host Ansible controlador
  ansible.builtin.file:
    path: "/tmp/ansible-etcd-backups"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: etcd_transfer_mode == 'controller_mediated'

# ==============================================================================
# MODO 2: Sincronización Directa de Servidor a Servidor (Rsync sobre SSH)
# Requiere conectividad de red directa y claves SSH entre masters y storage.
# ==============================================================================
- name: TRANSFERENCIA [Modo Rsync Directo] - Asegurar que rsync está instalado
  ansible.builtin.package:
    name: rsync
    state: present
  when: etcd_transfer_mode == 'direct_rsync'

- name: TRANSFERENCIA [Modo Rsync Directo] - Sincronizar archivo directamente al Storage de Backup
  ansible.posix.synchronize:
    src: "{{ etcd_snapshot_src }}"
    dest: "{{ etcd_backup_server_dir }}/{{ inventory_hostname }}-{{ etcd_snapshot_src | basename }}"
    mode: push
    use_ssh_args: true
  delegate_to: "{{ inventory_hostname }}"
  loop: "{{ groups['backup_servers'] }}"
  when: etcd_transfer_mode == 'direct_rsync'
