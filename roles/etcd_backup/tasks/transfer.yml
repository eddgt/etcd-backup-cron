---
# roles/etcd_backup/tasks/transfer.yml

# ==============================================================================
# PREPARACIÓN: Asegurar directorios de destino
# ==============================================================================
- name: TRANSFERENCIA - Asegurar que existe el directorio de destino en los Servidores de Storage
  ansible.builtin.file:
    path: "{{ etcd_backup_server_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ item }}"
  loop: "{{ groups['backup_servers'] }}"
  run_once: true

# ==============================================================================
# DETECCIÓN: Buscar snapshot si la variable no está definida (ej. al usar tags)
# ==============================================================================
- name: TRANSFERENCIA - Buscar el último snapshot disponible en el nodo Master
  ansible.builtin.find:
    paths: "{{ etcd_local_backup_dir }}"
    patterns: "etcd-snapshot-*.db.gz"
  register: local_found_snapshots
  when: etcd_snapshot_gz is not defined

- name: TRANSFERENCIA - Validar que existan snapshots en el nodo Master
  ansible.builtin.fail:
    msg: "No se encontraron archivos de backup (*.db.gz) en el directorio {{ etcd_local_backup_dir }} del nodo Master."
  when: etcd_snapshot_gz is not defined and (local_found_snapshots.files is not defined or local_found_snapshots.files | length == 0)

- name: TRANSFERENCIA - Establecer ruta del snapshot más reciente encontrado
  ansible.builtin.set_fact:
    etcd_snapshot_gz: "{{ (local_found_snapshots.files | sort(attribute='mtime', reverse=true) | first).path }}"
  when: etcd_snapshot_gz is not defined

# ==============================================================================
# MODO 1: Mediante la Máquina Controladora (Controller-Mediated Transfer)
# ==============================================================================
- name: TRANSFERENCIA [Modo Controlador] - Descargar snapshot al host Ansible controlador
  ansible.builtin.fetch:
    src: "{{ etcd_snapshot_gz }}"
    dest: "/tmp/ansible-etcd-backups/{{ inventory_hostname }}/"
    flat: true
  when: etcd_transfer_mode == 'controller_mediated'

- name: TRANSFERENCIA [Modo Controlador] - Subir snapshot a los servidores de backup
  ansible.builtin.copy:
    src: "/tmp/ansible-etcd-backups/{{ inventory_hostname }}/{{ etcd_snapshot_gz | basename }}"
    dest: "{{ etcd_backup_server_dir }}/{{ inventory_hostname }}-{{ etcd_snapshot_gz | basename }}"
    mode: '0600'
    owner: "{{ ansible_user }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['backup_servers'] }}"
  when: etcd_transfer_mode == 'controller_mediated'

- name: TRANSFERENCIA [Modo Controlador] - Limpiar archivos temporales del host Ansible controlador
  ansible.builtin.file:
    path: "/tmp/ansible-etcd-backups"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: etcd_transfer_mode == 'controller_mediated'


# ==============================================================================
# MODO 2: Sincronización Directa de Servidor a Servidor (Rsync sobre SSH)
# ==============================================================================
- name: TRANSFERENCIA [Modo Rsync Directo] - Validar existencia de rsync local y remoto
  ansible.builtin.package:
    name: rsync
    state: present
  when: etcd_transfer_mode == 'direct_rsync'

- name: TRANSFERENCIA [Modo Rsync Directo] - Sincronizar archivo directamente al Storage de Backup
  ansible.posix.synchronize:
    src: "{{ etcd_snapshot_gz }}"
    dest: "{{ etcd_backup_server_dir }}/{{ inventory_hostname }}-{{ etcd_snapshot_gz | basename }}"
    mode: push
    use_ssh_args: true
  delegate_to: "{{ inventory_hostname }}"
  loop: "{{ groups['backup_servers'] }}"
  when: etcd_transfer_mode == 'direct_rsync'
