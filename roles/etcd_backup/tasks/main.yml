---
# roles/etcd_backup/tasks/main.yml
# Orquestador del Rol de Backup de etcd para RKE2.
#
# RKE2 ya genera sus snapshots de etcd de forma automática en cada control plane.
# Este rol NO crea snapshots: solo copia el snapshot más reciente de cada control
# plane hacia los servidores de backup y aplica la política de retención en destino.
# El snapshot original gestionado por RKE2 nunca se modifica ni se elimina.

- name: "📂 FASE 1: Transferencia del Snapshot RKE2 a los Servidores de Backup"
  ansible.builtin.import_tasks: transfer.yml
  tags: [backup_run, backup_transfer]

- name: "🧹 FASE 2: Aplicación de la Política de Retención (Pruning)"
  ansible.builtin.import_tasks: prune.yml
  tags: [backup_run, backup_prune]
