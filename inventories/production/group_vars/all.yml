---
# inventories/production/group_vars/all.yml

# --- Configuración General de Conexión ---
ansible_user: ansible
ansible_ssh_private_key_file: "~/.ssh/id_rsa"

# --- Origen del Backup (RKE2) ---
# Directorio donde RKE2 guarda automáticamente sus snapshots de etcd en cada control plane.
# El rol etcd_backup solo COPIA el más reciente de aquí hacia los servidores de backup.
rke2_snapshot_dir: "/var/lib/rancher/rke2/server/db/snapshots"

# --- Configuración del Destino y Transferencia ---
# Método de transferencia:
# - 'controller_mediated': el nodo controlador (donde corre Ansible) descarga el snapshot
#   y luego lo sube a los backup_servers (ideal para redes segmentadas).
# - 'direct_rsync': los masters hacen rsync directo a los backup_servers (requiere
#   conectividad de red directa y claves SSH configuradas entre ellos).
etcd_transfer_mode: "controller_mediated"

# Directorio final de almacenamiento en los servidores de backup
etcd_backup_server_dir: "/srv/backup/kubernetes/etcd"

# --- Política de Retención ---
# Cantidad de copias de etcd a retener en los servidores de backup por cada master.
# (En el origen/control planes, la retención la gestiona el propio motor de RKE2.)
etcd_backup_server_retention_count: 3
